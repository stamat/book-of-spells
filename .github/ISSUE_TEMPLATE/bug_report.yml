name: Bug report
description: Something behaves differently than it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fastest fixes come from reports that
        someone else can run — a few lines that reproduce it beat a paragraph
        describing it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what you got.
      placeholder: |
        `deepMerge()` drops keys whose value is `undefined`, `parseDataAttribute()` returns a string for `data-x="1"`.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        The call and its arguments — a few lines that can be pasted into a REPL
        or a test. Name the function in the title if you can.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Book of Spells version
      description: A release, a tag, or `main` at a commit.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, or the browser — several of these helpers touch the DOM, and those only misbehave in one of the two.
      placeholder: "Node 24.2 / macOS 15.4 — or Safari 26 on iOS"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error message, stack trace, or log. Paste it whole — the interesting line is rarely the last one.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues, open and closed
          required: true
        - label: I can reproduce this on the latest release
          required: false
        - label: I agree to follow this project's [Code of Conduct](https://github.com/stamat/book-of-spells/blob/main/CODE_OF_CONDUCT.md)
          required: true
